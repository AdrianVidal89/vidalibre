# Vidalibre en el NAS Jupiter.
#
# Memoria: el NAS tiene 3,7 GB para todo. Vidalibre en reposo anda por los
# 70-90 MB; lo que se dispara es la conversión, que arranca un Calibre entero
# (Qt incluido) y puede pedir 400-600 MB con un libro gordo. De ahí el techo
# de 768 MB y el permiso para tirar de intercambio hasta 1,5 GB: antes lento
# que llevarse por delante a Treasure o a Alejandria.
services:
  web:
    build:
      context: .
      args:
        CALIBRE_VERSION: ${CALIBRE_VERSION:-9.14.0}
    image: vidalibre:latest
    container_name: vidalibre
    restart: unless-stopped
    # El usuario dueño de las carpetas en QTS: adrian es 1000 y su grupo es
    # `everyone` (100), no un grupo con su nombre.
    user: "${USUARIO:-1000:100}"
    ports:
      - "${PUERTO:-8084}:8084"
    environment:
      - VIDALIBRE_BIBLIOTECA=/biblioteca
      - VIDALIBRE_DATOS=/datos
      - VIDALIBRE_MODO=nas
      - VIDALIBRE_PUERTO=8084
      - VIDALIBRE_TITULO=${TITULO:-Vidalibre}
      - VIDALIBRE_SOLO_LECTURA=${SOLO_LECTURA:-0}
      - TZ=${TZ:-Europe/Madrid}
      - HOME=/tmp
    volumes:
      - ${BIBLIOTECA:?define BIBLIOTECA en .env}:/biblioteca
      - ./datos:/datos
    mem_limit: 768m
    memswap_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8084/estado', timeout=10).status == 200 else 1)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
